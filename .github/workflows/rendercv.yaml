name: Render a CV

on:
  push:
    branches:
      - main
  workflow_call: # to make the workflow triggerable from other workflows (release.yaml)

permissions:
  contents: write

jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install RenderCV
        run: uv sync --locked --all-extras --dev

      - name: RenderCV
        run: |
          cv_file=$(find .  -maxdepth 1 -type f -name "*-cv.yaml" | head -n 1)
          if [ -z "$cv_file" ]; then
            echo "No RenderCV file found!"
            exit 1
          fi
          uv run rendercv render $cv_file --pdf-path ${cv_file%.yaml}.pdf --markdown-path README.md --typst-path ${cv_file%.yaml}.typ
          echo "CV_PDF=${cv_file%.yaml}.pdf" >> "$GITHUB_ENV"

      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v6
        with:
          name: RenderCV Output
          path: rendercv_output

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          base: HEAD
          filters: |
            cv:
              - '*-cv.typ'
              - 'README.md'

      - name: Push the changes
        if: steps.changes.outputs.cv == 'true'
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "render the latest CV"
          git push

      # --- NEW: publish the PDF to sisaman/sisaman.github.io ---
      - name: Checkout website repo
        uses: actions/checkout@v6
        with:
          repository: sisaman/sisaman.github.io
          token: ${{ secrets.PUBLISH_TOKEN }} # PAT with (public_)repo scope
          path: website
          fetch-depth: 0

      - name: Copy PDF into website repo
        run: |
          # Place it at the site root
          cp "$CV_PDF" website/

      - name: Commit & push PDF to website
        run: |
          set -euo pipefail
          cd website
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add .
          git commit -m "Update CV PDF from $GITHUB_REPOSITORY@${GITHUB_SHA::7}" || echo "No changes to commit in website repo"
          git push
