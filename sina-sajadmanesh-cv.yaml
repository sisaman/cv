design:
  theme: engineeringresumes
  typography:
    font_size:
      body: 10pt
      name: 25pt
    alignment: left
    small_caps:
      section_titles: true
  page:
    size: a4
    top_margin: 2cm
    bottom_margin: 2cm
    left_margin: 2cm
    right_margin: 2cm
  colors:
    body: black
    links: 031c30
    section_titles: '#004f90'
  sections:
    space_between_regular_entries: 1em
    space_between_text_based_entries: 1em
    allow_page_break: true
  section_titles:
    space_below: 0.5cm
    space_above: 0.7cm
  links:
    show_external_link_icon: false
    underline: false
  header:
    connections:
      hyperlink: true
      show_icons: true
      separator: ''
      display_urls_instead_of_usernames: false
      space_between_connections: 8pt
  entries:
    allow_page_break: true
    highlights:
      # bullet: ○
      space_above: 0.75em
      space_left: 0.5em
      space_between_items: 0em
  templates:
    footer: NAME - Page PAGE_NUMBER of TOTAL_PAGES
    experience_entry:
      main_column: |-
        **COMPANY**, POSITION -- LOCATION
        HIGHLIGHTS
    publication_entry:
      main_column: |-
        **TITLE**
        AUTHORS
        JOURNAL
      date_and_location_column: DATE
    normal_entry:
      main_column: |-
        **NAME**, DEGREE in AREA
      date_and_location_column: DATE
